<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amira Restaurant | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header & Navigation -->
    <header class="main-header">
        <div class="logo">
            <h1>Amira Restaurant</h1>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Form Section -->
    <main class="container">
        <h2 class="page-title">Naga Soo Xiriir</h2>

        <form action="#" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">Magacaaga Plss:</label>
                <input type="text" id="name" name="name" placeholder="Geli magacaaga" required>
            </div>

            <div class="form-group">
                <label for="email">Email-kaaga:</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Ujeeddada:</label>
                <input type="text" id="subject" name="subject" placeholder="Ujeeddada fariinta">
            </div>

            <div class="form-group">
                <label for="message">Fariintaada:</label>
                <textarea id="message" name="message" rows="5" placeholder="Qor fariintaada halkan..."
                    required></textarea>
            </div>

            <button type="submit" class="submit-btn">Dir Fariinta</button>
        </form>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Amira Restaurant. All rights reserved.</p>
    </footer>

</body>

</html>
